<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 568" width="1280" height="568" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<defs>
<radialGradient id="g" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#2f74cc" stop-opacity="0.10"/><stop offset="1" stop-color="#4fd2e6" stop-opacity="0"/></radialGradient>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#121a33"/></linearGradient>
</defs>
<rect width="1280" height="568" rx="24" fill="#070b18"/>
<rect width="1280" height="568" rx="24" fill="url(#g)"/>
<rect x="40" y="36" width="6" height="36" rx="3" fill="#4fd2e6"/>
<text x="60" y="66" font-size="32" font-weight="700" fill="#ffffff">Browse</text>
<rect x="40.0" y="104" width="93" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="72.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Tabs</text>
<text x="46.0" y="170" font-size="20" fill="#b4c2e0">Drag, pin and lock. The session comes back.</text>
<rect x="660.0" y="104" width="122" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="692.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">7 views</text>
<text x="666.0" y="170" font-size="20" fill="#b4c2e0">Details, list, icons, tiles, tree, columns, flat.</text>
<rect x="40.0" y="192" width="174" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="72.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Columns view</text>
<text x="46.0" y="258" font-size="20" fill="#b4c2e0">Cascading columns, as in the macOS Finder.</text>
<rect x="660.0" y="192" width="134" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="692.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Flat view</text>
<text x="666.0" y="258" font-size="20" fill="#b4c2e0">Every file of every subfolder in one list.</text>
<rect x="40.0" y="280" width="139" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="72.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Tree view</text>
<text x="46.0" y="346" font-size="20" fill="#b4c2e0">Open folders in place, with guide lines.</text>
<rect x="660.0" y="280" width="127" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="692.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Group by</text>
<text x="666.0" y="346" font-size="20" fill="#b4c2e0">Category, type, date or size. Four styles.</text>
<rect x="40.0" y="368" width="199" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="72.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Per-folder views</text>
<text x="46.0" y="434" font-size="20" fill="#b4c2e0">Each folder remembers its view and columns.</text>
<rect x="660.0" y="368" width="159" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="692.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Folder sizes</text>
<text x="666.0" y="434" font-size="20" fill="#b4c2e0">Real folder sizes, worked out in the background.</text>
<rect x="40.0" y="456" width="148" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="475" r="4" fill="#4fd2e6"/>
<text x="72.0" y="481.5" font-size="18" font-weight="700" fill="#ffffff">Long paths</text>
<text x="46.0" y="522" font-size="20" fill="#b4c2e0">Paths up to 32,767 characters, everywhere.</text>
</svg>
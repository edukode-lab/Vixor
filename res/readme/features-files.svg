<circle cx="59.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="72.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Undo / Redo</text>
<text x="46.0" y="170" font-size="20" fill="#b4c2e0">Rename, move, copy, create and delete.</text>
<rect x="660.0" y="104" width="171" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="692.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Batch rename</text>
<text x="666.0" y="170" font-size="20" fill="#b4c2e0">15 kinds of steps, EXIF, regex, live preview.</text>
<rect x="40.0" y="192" width="189" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="72.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Advanced paste</text>
<text x="46.0" y="258" font-size="20" fill="#b4c2e0">Only newer, only changed, or verified.</text>
<rect x="660.0" y="192" width="140" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="692.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Edit dates</text>
<text x="666.0" y="258" font-size="20" fill="#b4c2e0">Created, modified and accessed, many at once.</text>

<circle cx="59.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="72.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Drag &amp; drop</text>
<text x="46.0" y="346" font-size="20" fill="#b4c2e0">Between panels, tabs and other programs.</text>
<rect x="660.0" y="280" width="171" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="692.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Context menu</text>
<text x="666.0" y="346" font-size="20" fill="#b4c2e0">Searchable, favorites, three styles.</text>
<rect x="40.0" y="368" width="154" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="72.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Recycle Bin</text>
<text x="46.0" y="434" font-size="20" fill="#b4c2e0">Browse it and restore files.</text>
<rect x="660.0" y="368" width="126" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="692.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Clean up</text>
<text x="666.0" y="434" font-size="20" fill="#b4c2e0">Find and remove empty files and folders.</text>
<rect x="40.0" y="456" width="143" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="475" r="4" fill="#4fd2e6"/>
<text x="72.0" y="481.5" font-size="18" font-weight="700" fill="#ffffff">Unlock file</text>
<text x="46.0" y="522" font-size="20" fill="#b4c2e0">See which program holds a file, and close it.</text>
<rect x="660.0" y="456" width="151" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="475" r="4" fill="#4fd2e6"/>
<text x="692.0" y="481.5" font-size="18" font-weight="700" fill="#ffffff">Checksums</text>
<text x="666.0" y="522" font-size="20" fill="#b4c2e0">MD5, SHA-1, SHA-256, CRC-32, xxHash64.</text>
<rect x="40.0" y="544" width="147" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="563" r="4" fill="#4fd2e6"/>
<text x="72.0" y="569.5" font-size="18" font-weight="700" fill="#ffffff">Split &amp; join</text>
<text x="46.0" y="610" font-size="20" fill="#b4c2e0">Cut big files into parts and back.</text>
<rect x="660.0" y="544" width="126" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="563" r="4" fill="#4fd2e6"/>
<text x="692.0" y="569.5" font-size="18" font-weight="700" fill="#ffffff">Print list</text>
<text x="666.0" y="610" font-size="20" fill="#b4c2e0">A folder to the printer, PDF, Excel or CSV.</text>
<rect x="40.0" y="632" width="179" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="651" r="4" fill="#4fd2e6"/>
<text x="72.0" y="657.5" font-size="18" font-weight="700" fill="#ffffff">Text statistics</text>
<text x="46.0" y="698" font-size="20" fill="#b4c2e0">Lines, encoding and line endings of many files.</text>
<rect x="660.0" y="632" width="147" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="651" r="4" fill="#4fd2e6"/>
<text x="692.0" y="657.5" font-size="18" font-weight="700" fill="#ffffff">Passwords</text>
<text x="666.0" y="698" font-size="20" fill="#b4c2e0">Remember archive and PDF passwords: they open by themselves.</text>

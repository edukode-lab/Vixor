<circle cx="679.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="692.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Tags</text>
<text x="666.0" y="258" font-size="20" fill="#b4c2e0">Colors and words that survive renames and moves.</text>
<rect x="40.0" y="280" width="156" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="72.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Workspaces</text>
<text x="46.0" y="346" font-size="20" fill="#b4c2e0">Files from anywhere in one virtual folder.</text>
<rect x="660.0" y="280" width="143" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="692.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Comments</text>
<text x="666.0" y="346" font-size="20" fill="#b4c2e0">A note on any file, in its own column.</text>
<rect x="40.0" y="368" width="166" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="72.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Folder colors</text>
<text x="46.0" y="434" font-size="20" fill="#b4c2e0">Ten colors or your own, plus 40 glyphs.</text>
<rect x="660.0" y="368" width="188" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="692.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Folder contents</text>
<text x="666.0" y="434" font-size="20" fill="#b4c2e0">Big folder icons show what they hold.</text>

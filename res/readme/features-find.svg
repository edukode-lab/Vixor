<circle cx="59.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="72.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Search</text>
<text x="46.0" y="170" font-size="20" fill="#b4c2e0">Names or text inside files, Office included.</text>
<rect x="660.0" y="104" width="165" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="692.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Query syntax</text>
<text x="666.0" y="170" font-size="20" fill="#b4c2e0">ext:pdf size:&gt;10MB modified:&lt;7d tag:work</text>
<rect x="40.0" y="192" width="200" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="72.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Advanced search</text>
<text x="46.0" y="258" font-size="20" fill="#b4c2e0">A form for the query, regex included. Save it.</text>

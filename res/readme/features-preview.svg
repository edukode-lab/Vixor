<circle cx="59.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="72.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Documents</text>
<text x="46.0" y="170" font-size="20" fill="#b4c2e0">Word, Excel, PowerPoint and PDF, safely.</text>
<rect x="660.0" y="104" width="123" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="123" r="4" fill="#4fd2e6"/>
<text x="692.0" y="129.5" font-size="18" font-weight="700" fill="#ffffff">Pictures</text>
<text x="666.0" y="170" font-size="20" fill="#b4c2e0">Zoom, pan, a mini-map, rotate for good.</text>
<rect x="40.0" y="192" width="159" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="72.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Audio player</text>
<text x="46.0" y="258" font-size="20" fill="#b4c2e0">Cover, waveform and a live glowing spectrum.</text>
<rect x="660.0" y="192" width="98" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="211" r="4" fill="#4fd2e6"/>
<text x="692.0" y="217.5" font-size="18" font-weight="700" fill="#ffffff">Video</text>
<text x="666.0" y="258" font-size="20" fill="#b4c2e0">Codec, tracks, subtitles and four frames.</text>
<rect x="40.0" y="280" width="190" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="72.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Books &amp; comics</text>
<text x="46.0" y="346" font-size="20" fill="#b4c2e0">Read EPUB, CBZ and CBR right there.</text>
<rect x="660.0" y="280" width="141" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="299" r="4" fill="#4fd2e6"/>
<text x="692.0" y="305.5" font-size="18" font-weight="700" fill="#ffffff">Markdown</text>
<text x="666.0" y="346" font-size="20" fill="#b4c2e0">Rendered, with working links.</text>
<rect x="40.0" y="368" width="161" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="72.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">HTML pages</text>
<text x="46.0" y="434" font-size="20" fill="#b4c2e0">Web pages shown as in Edge (WebView2).</text>
<rect x="660.0" y="368" width="190" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="387" r="4" fill="#4fd2e6"/>
<text x="692.0" y="393.5" font-size="18" font-weight="700" fill="#ffffff">Inside archives</text>
<text x="666.0" y="434" font-size="20" fill="#b4c2e0">What a ZIP, 7z, RAR or ISO holds, unextracted.</text>
<rect x="40.0" y="456" width="149" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="475" r="4" fill="#4fd2e6"/>
<text x="72.0" y="481.5" font-size="18" font-weight="700" fill="#ffffff">Folder map</text>
<text x="46.0" y="522" font-size="20" fill="#b4c2e0">A folder&#x27;s structure as a tree with sizes.</text>
<rect x="660.0" y="456" width="83" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="475" r="4" fill="#4fd2e6"/>
<text x="692.0" y="481.5" font-size="18" font-weight="700" fill="#ffffff">Hex</text>
<text x="666.0" y="522" font-size="20" fill="#b4c2e0">The bytes of any file.</text>
<rect x="40.0" y="544" width="165" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="59.0" cy="563" r="4" fill="#4fd2e6"/>
<text x="72.0" y="569.5" font-size="18" font-weight="700" fill="#ffffff">Own window</text>
<text x="46.0" y="610" font-size="20" fill="#b4c2e0">Send the preview to another screen.</text>
<rect x="660.0" y="544" width="132" height="38" rx="19" fill="url(#chip)" stroke="#2b3a66"/>
<circle cx="679.0" cy="563" r="4" fill="#4fd2e6"/>
<text x="692.0" y="569.5" font-size="18" font-weight="700" fill="#ffffff">DNA files</text>
<text x="666.0" y="610" font-size="20" fill="#b4c2e0">FASTA / FASTQ counts and AB1 chromatograms.</text>
</svg>
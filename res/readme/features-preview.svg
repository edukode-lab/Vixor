<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 656" width="1280" height="656" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<defs>
<radialGradient id="g" cx="0" cy="0" r="0.9"><stop offset="0" stop-color="#2f74cc" stop-opacity="0.10"/><stop offset="1" stop-color="#4fd2e6" stop-opacity="0"/></radialGradient>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#121a33"/></linearGradient>
</defs>
<rect width="1280" height="656" rx="24" fill="#070b18"/>
<rect width="1280" height="656" rx="24" fill="url(#g)"/>
<rect x="40" y="36" width="6" height="36" rx="3" fill="#4fd2e6"/>
<text x="60" y="66" font-size="32" font-weight="700" fill="#ffffff">Preview</text>
